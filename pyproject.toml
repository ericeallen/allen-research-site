[project]
name = "allen-research-site"
version = "1.0.0"
description = "Static site generator and content for allen-research.com"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["tools/towel_demo/example"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "C4", "PIE", "RET"]
ignore = ["E501", "RUF001", "RUF002"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["sitegen", "tests", "tools"]
exclude = ["tools/towel_demo/example/"]
